<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>What's Dale up to? — Dale O'Brien</title>
        <meta name="description" content="What Dale is up to right now, straight from his iPhone's Focus modes." />
        <link rel="stylesheet" href="../style.css" />
        <style>
            body, .brand { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
            .sleep { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: clamp(1rem, 3vh, 2rem) clamp(2rem, 5vw, 4rem); padding: clamp(1.5rem, 7vh, 6rem) 0; }
            .face[hidden] { display: block; visibility: hidden; }
            .face { width: clamp(7rem, min(30vh, 45vw), 16rem); height: auto; color: #000; flex: 0 0 auto; }
            .sleep-text { flex: 0 1 auto; min-width: 0; display: flex; flex-direction: column; gap: clamp(0.5rem, 2vh, 1.25rem); }
            .sleep h1 { margin: 0; font-weight: 700; font-size: clamp(3rem, 8vw, 7rem); line-height: 0.95; letter-spacing: -0.045em; }
            .note { margin: 0; font-size: 0.875rem; color: #555; max-width: 36ch; line-height: 1.5; }
            @media (max-width: 640px) {
                .sleep { flex-direction: column; text-align: center; }
                .sleep-text { flex: none; align-items: center; }
            }
            
            .states { border-top: 1px solid #000; padding: clamp(1.25rem, 4vh, 3rem) 0; }
            .states-row { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--cols, 5), minmax(0, 4.75rem)); justify-content: center; gap: 1.5rem clamp(0.5rem, 2vw, 1.25rem); }
            .state { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; opacity: 0.25; font-size: 0.75rem; font-weight: 500; text-align: center; transition: opacity 200ms; }
            .state[hidden] { display: none; }
            .state:hover { opacity: 0.6; }
            .state img { width: min(3.5rem, 100%); height: auto; }
            @media (prefers-reduced-motion: reduce) { .state { transition: none; } }
            /* Small screens and short windows: tighter spacing all round. */
            @media (max-width: 640px), (max-height: 600px) {
                .topbar { padding: 1rem 0; }
                .sleep { gap: 0.5rem 2rem; padding: 1rem 0 1.25rem; }
                .sleep-text { gap: 0.375rem; }
                .face { width: clamp(6rem, min(24vh, 36vw), 12rem); }
                .states { padding: 1rem 0 1.25rem; }
                .states-row { row-gap: 1rem; }
                .state { gap: 0.25rem; }
                .state img { width: min(2.75rem, 100%); }
            }
        </style>
    </head>
    <body>
        <div class="page">
            <header class="site-header">
                <div class="topbar">
                    <a class="brand" href="../">daleobrien</a>
                </div>
            </header>

            <main class="sleep" aria-live="polite">
                <img class="face" id="face" src="faces/awake.svg" alt="" hidden />

                <div class="sleep-text">
                    <h1 id="state">&nbsp;</h1>
                    <p class="sub" id="since"></p>
                </div>
            </main>

            <section class="states" aria-label="All the faces">
                <ul class="states-row" id="states"></ul>
            </section>
        </div>
        <script>
            const SOURCES = [
                ["https://api.github.com/repos/daleobrien/daleobrien/contents/status.json", { headers: { Accept: "application/vnd.github.raw+json" } }],
                ["https://raw.githubusercontent.com/daleobrien/daleobrien/main/status.json", {}],
            ];
            const MELBOURNE = "Australia/Melbourne";

            // Language: ?lang=de or ?lang=en wins, then the browser's preferred languages.
            const TEXT = {
                en: {
                    locale: "en-AU",
                    states: {
                        awake: ["Awake", "awake"],
                        asleep: ["Asleep", "asleep"],
                        work: ["At work", "at work"],
                        driving: ["Driving", "driving"],
                        fitness: ["Working out", "working out"],
                        gaming: ["Gaming", "gaming"],
                        reading: ["Reading", "reading"],
                        mindfulness: ["Mindful", "being mindful"],
                        dnd: ["Heads down", "do not disturb"],
                        reduce: ["Quiet", "keeping things quiet"],
                        personal: ["Free", "free"],
                    },
                    since: (when, ago) => `Since ${when}, ${ago} ago.`,
                    yesterday: (time) => `yesterday ${time}`,
                    duration: (h, m) => (h ? `${h}h ${m}m` : `${m}m`),
                    probably: " Probably, anyway.",
                    clockSleep: " Set by the clock at 22:00.",
                    clockWake: " Set by the clock at 07:00.",
                    unknown: "Not sure",
                    offline: "Couldn't reach GitHub just now. Trying again shortly.",
                    alt: (what) => `Dale's face: ${what}`,
                    title: (state) => `${state} — What's Dale up to?`,
                    faces: "All the faces",
                },
                de: {
                    locale: "de-DE",
                    states: {
                        awake: ["Wach", "wach"],
                        asleep: ["Schläft", "schläft"],
                        work: ["Bei der Arbeit", "bei der Arbeit"],
                        driving: ["Am Steuer", "am Steuer"],
                        fitness: ["Beim Sport", "beim Sport"],
                        gaming: ["Am Zocken", "am Zocken"],
                        reading: ["Am Lesen", "am Lesen"],
                        mindfulness: ["Achtsam", "achtsam"],
                        dnd: ["Konzentriert", "nicht stören"],
                        reduce: ["Ruhig", "lieber ruhig"],
                        personal: ["Frei", "frei"],
                    },
                    since: (when, ago) => `Seit ${when}, vor ${ago}`.replace(/\.?$/, "."),
                    yesterday: (time) => `gestern ${time}`,
                    duration: (h, m) => (h ? `${h} Std. ${m} Min.` : `${m} Min.`),
                    probably: " Wahrscheinlich jedenfalls.",
                    clockSleep: " Um 22:00 von der Uhr gesetzt.",
                    clockWake: " Um 07:00 von der Uhr gesetzt.",
                    unknown: "Unklar",
                    offline: "GitHub ist gerade nicht erreichbar. Gleich noch einmal.",
                    alt: (what) => `Dales Gesicht: ${what}`,
                    title: (state) => `${state} — Was macht Dale gerade?`,
                    faces: "Alle Gesichter",
                },
            };
            function pickLanguage() {
                const asked = new URLSearchParams(location.search).get("lang");
                const wanted = asked ? [asked] : navigator.languages || [navigator.language || "en"];
                for (const tag of wanted) {
                    const base = String(tag).toLowerCase().split("-")[0];
                    if (TEXT[base]) return base;
                }
                return "en";
            }
            const LANG = pickLanguage();
            const T = TEXT[LANG];
            document.documentElement.lang = LANG;
            document.querySelector(".states").setAttribute("aria-label", T.faces);

            async function load() {
                for (const [url, opts] of SOURCES) {
                    try {
                        const res = await fetch(url, { ...opts, cache: "no-store" });
                        if (res.ok) return await res.json();
                    } catch (e) { /* try the next source */ }
                }
                return null;
            }

            function when(date) {
                const day = (d) => d.toLocaleDateString("en-AU", { timeZone: MELBOURNE });
                // 24-hour time; the zone name stays Australian (AEDT/AEST) in every language.
                const clock = date.toLocaleTimeString("en-AU", { timeZone: MELBOURNE, hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
                const zone = date.toLocaleTimeString("en-AU", { timeZone: MELBOURNE, timeZoneName: "short" }).split(" ").pop();
                const time = `${clock} ${zone}`;
                if (day(date) === day(new Date())) return time;
                if (day(date) === day(new Date(Date.now() - 864e5))) return T.yesterday(time);
                const weekday = date.toLocaleDateString(T.locale, { timeZone: MELBOURNE, weekday: "long" });
                return `${weekday} ${time}`;
            }

            function duration(ms) {
                const mins = Math.max(0, Math.round(ms / 60000));
                const h = Math.floor(mins / 60), m = mins % 60;
                return T.duration(h, m);
            }

            const STATES = T.states;

            // Order of the row of faces under the main one.
            const ORDER = ["awake", "asleep", "work", "dnd", "reduce", "driving", "fitness", "gaming", "reading", "mindfulness"];
            // Every face has a little animation, always running, big face and grid alike.
            const ANIMATED = ["awake", "asleep", "work", "dnd", "reduce", "driving", "fitness", "gaming", "reading", "mindfulness"];
            const faceSrc = (key, animate) => `faces/${key}${animate && ANIMATED.includes(key) ? "-animated" : ""}.svg`;
            const row = document.getElementById("states");
            for (const key of ORDER) {
                const li = document.createElement("li");
                li.className = "state";
                li.dataset.state = key;
                const img = document.createElement("img");
                img.src = faceSrc(key, true);
                img.alt = "";
                const label = document.createElement("span");
                label.textContent = STATES[key][0];
                li.append(img, label);
                row.append(li);
            }

            // Lay the faces out in equal rows: the most columns that fit and divide the
            // number of faces evenly (10 -> 10, 5 or 2 per row).
            function layoutRow() {
                const n = [...row.children].filter((li) => !li.hidden).length;
                const remPx = parseFloat(getComputedStyle(document.documentElement).fontSize);
                const minItem = 3.25 * remPx, gap = parseFloat(getComputedStyle(row).columnGap) || 0;
                const fit = Math.max(1, Math.floor((row.clientWidth + gap) / (minItem + gap)));
                let cols = 1;
                for (let c = Math.min(n, fit); c >= 1; c--) if (n % c === 0) { cols = c; break; }
                row.style.setProperty("--cols", cols);
            }
            layoutRow();
            window.addEventListener("resize", layoutRow);

            async function update() {
                const status = await load();
                const stateEl = document.getElementById("state");
                const sinceEl = document.getElementById("since");
                const face = document.getElementById("face");
                if (!status) {
                    stateEl.textContent = T.unknown;
                    sinceEl.textContent = T.offline;
                    return;
                }
                let state = STATES[status.state] ? status.state : "awake";
                let since = new Date(status.since);
                let note = "";
                // A Focus that should have ended by now: the phone missed the "off".
                if (status.expires && new Date(status.expires) < new Date()) {
                    since = new Date(status.expires);
                    state = "awake";
                    note = T.probably;
                } else if (status.source === "clock") {
                    note = state === "asleep" ? T.clockSleep : T.clockWake;
                }
                const [title, alt] = STATES[state];
                face.src = faceSrc(state, true);
                face.alt = T.alt(alt);
                face.hidden = false;
                // The row shows the other faces; the current one is the big face above.
                for (const li of row.children) li.hidden = li.dataset.state === state;
                layoutRow();
                stateEl.textContent = title;
                sinceEl.textContent = T.since(when(since), duration(Date.now() - since)) + note;
                document.title = T.title(title);
            }

            update();
            setInterval(update, 2 * 60 * 1000);
            document.addEventListener("visibilitychange", () => { if (!document.hidden) update(); });
        </script>
    </body>
</html>
