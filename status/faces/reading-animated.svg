<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 181 235" aria-label="bald round face with stubble, reading" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <style>
    /* Eyes read along a line, then flick back to the start of the next one. */
    .eye { animation: read 3s ease-in-out infinite; }
    @keyframes read {
      0%, 6% { transform: translateX(-4px); }
      22% { transform: translateX(-1.5px); }
      28% { transform: translateX(-1.5px); }
      44% { transform: translateX(1px); }
      50% { transform: translateX(1px); }
      66% { transform: translateX(4px); }
      80% { transform: translateX(4px); }
      88%, 100% { transform: translateX(-4px); }
    }
    @media (prefers-reduced-motion: reduce) { .eye { animation: none; } }
  </style>
  <mask id="ear-mask-reading" maskUnits="userSpaceOnUse" x="-20" y="-20" width="221" height="275">
