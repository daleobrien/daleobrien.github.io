<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 181 235" aria-label="bald round face with stubble, working out" fill="none" stroke="#000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <style>
    /* The sweat drop runs down the side of the head and a new one forms. */
    .drop { animation: drip 2.4s ease-in infinite; }
    @keyframes drip {
      0% { opacity: 0; transform: translateY(-4px); }
      20% { opacity: 1; transform: translateY(0); }
      45% { opacity: 1; transform: translateY(0); }
      85% { opacity: 0; transform: translateY(18px); }
      100% { opacity: 0; transform: translateY(18px); }
    }
    @media (prefers-reduced-motion: reduce) { .drop { animation: none; } }
  </style>
