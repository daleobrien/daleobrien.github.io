                <div class="sleep-text">
                    <h1 id="state">Checking&hellip;</h1>
                    <p class="sub" id="since"></p>
                    <p class="note">Straight from my iPhone&rsquo;s Sleep Focus, which my Apple Watch turns on at bedtime. Times are Melbourne time.</p>

            </footer>
        </div>
        <script>
            const SOURCES = [
                ["https://api.github.com/repos/daleobrien/daleobrien/contents/status.json", { headers: { Accept: "application/vnd.github.raw+json" } }],
                ["https://raw.githubusercontent.com/daleobrien/daleobrien/main/status.json", {}],
            ];
            const MELBOURNE = "Australia/Melbourne";

            async function load() {
                for (const [url, opts] of SOURCES) {
                    try {
                        const res = await fetch(url, { ...opts, cache: "no-store" });
                        if (res.ok) return await res.json();
                    } catch (e) { /* try the next source */ }
                }
                return null;
            }

            function when(date) {
                const day = (d) => d.toLocaleDateString("en-AU", { timeZone: MELBOURNE });
                const time = date.toLocaleTimeString("en-AU", { timeZone: MELBOURNE, hour: "numeric", minute: "2-digit" });
                if (day(date) === day(new Date())) return time;
                if (day(date) === day(new Date(Date.now() - 864e5))) return `yesterday ${time}`;
                const weekday = date.toLocaleDateString("en-AU", { timeZone: MELBOURNE, weekday: "long" });
                return `${weekday} ${time}`;
            }

            function duration(ms) {
                const mins = Math.max(0, Math.round(ms / 60000));
                const h = Math.floor(mins / 60), m = mins % 60;
                return h ? `${h}h ${m}m` : `${m}m`;
            }

            async function update() {
                const status = await load();
                const stateEl = document.getElementById("state");
                const sinceEl = document.getElementById("since");
                if (!status) {
                    stateEl.textContent = "Not sure";
                    sinceEl.textContent = "Couldn't reach GitHub just now. Trying again shortly.";
                    return;
                }
                const asleep = status.state === "asleep";
                for (const face of document.querySelectorAll(".face")) face.toggleAttribute("hidden", face.dataset.state !== status.state);
                stateEl.textContent = asleep ? "Asleep" : "Awake";
                const since = new Date(status.since);
                let text = `Since ${when(since)}, ${duration(Date.now() - since)} ago.`;
                if (status.source === "clock") text += " Going by the clock, as my phone hasn't checked in lately.";
                sinceEl.textContent = text;
                document.title = `${asleep ? "Asleep" : "Awake"} — Is Dale awake?`;
            }

            update();
            setInterval(update, 2 * 60 * 1000);
            document.addEventListener("visibilitychange", () => { if (!document.hidden) update(); });
        </script>
